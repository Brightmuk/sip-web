<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SIP.js WebRTC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WebRTC video conference implementation using SIP.js v16">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      font-size: 14px !important;
      overflow-x: hidden;
    }

    body {
      background-color: #f4f4f4;
      color: #333;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2563eb;
      padding: 15px 20px;
      color: white;
      width: 100%;
    }

    .navbar .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .navbar .call-status {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .call-status .call-info {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 14px;
    }

    .navbar .user {
      display: flex;
      align-items: center;
    }

    .user .status-indicator {
      width: 12px;
      height: 12px;
      background: red;
      border-radius: 50%;
      margin-right: 8px;
    }

    /* Responsive Main Layout */
    #main {
      width: 100%;
      padding: 20px;
      gap: 20px;

    }

    @media (min-width: 768px) {
      #main {
        flex-direction: row;
      }
    }

    .dashboard,
    .conference {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      width: 100%;

    }

    .conference {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Dial Pad */
    .dialpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      place-items: center;
      gap: 15px;
      margin-top: 15px;
    }
    .call-controls{
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    .call-controls button{
      width: 50px;
      height: 50px;
      font-size: 18px !important;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dialpad button {
      width: 70px;
      height: 70px;
      font-size: 18px !important;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 70%;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dialpad button:hover {
      background-color: #e0e0e0 !important;
    }

    .dialpad-btn {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    .dialpad-btn button {
      
      padding: 10px;
      font-size: 30px;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      cursor: pointer;
      transition: all 0.3s;
    }


    #call-btn,#answer-btn {
      background-color: green;
      color: white;
      border: none;
    }

    #hangup-btn {
      background-color: red;
      color: white;
      border: none;
    }

    #call-btn:hover,
    #hangup-btn:hover {
      opacity: 0.8;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      font-size: 14px;
      color: #666;
    }

    /* Log container */
    #log-container {
      margin-top: 15px;
      border: 1px solid #ccc;
      padding: 10px;
      height: 120px;
      overflow-y: auto;
      font-family: monospace;
      background-color: #f9f9f9;
    }

    /* Responsive Design */
    @media (max-width: 600px) {


      .navbar .call-status {
        justify-content: center;
        margin-top: 10px;
      }


      .dashboard,
      .conference {
        max-width: 100%;
      }
    }

    input[type=text], input[type=password]{
      width: 100%;
      padding: 12px 20px;
      margin: 8px 0;
      display: inline-block;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    #register-btn,
    #unregister-btn {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 14px 20px;
      margin: 8px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #unregister-btn {
      background-color: orange;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="user">
      <div class="status-indicator"></div>
      <span id="username">NENACALL</span>
    </div>
    <div class="call-status">
      <div class="call-info" id="active-call">No active call</div>
    </div>

  </div>

  <div id="main">
    <!-- left side -->
    <div class="dashboard">

      <form id="create-sip-form"
        onsubmit="try { onCreateSipFormSubmit(this); } catch(e) { console.error('sip config form error', e) } finally { return false; }">

        <h1>Register Sip User</h1>
        <br />
        <br />
        
        <label for="sip-username">Username</label>
        <input type="text" id="sip-username" name="sipUsername" placeholder="e.g. 1000" value="1000" required />
        <label for="sip-domain">Domain</label>
        <input type="text" id="sip-domain" name="sipDomain" placeholder="e.g. 127.0.0.1"
          value="20.87.96.52" required />
        <label for="sip-port">Port</label>
        <input type="text" id="sip-port" name="sipPort" placeholder="e.g. 5060" value="7443" />
        <label for="password">Password</label>
        <input type="password"  id="password" name="password" value="Nenacall@Mobile.2025" />
        <br />
        <br />
        <button type="submit" id="register-btn">Register</button>
      </form>

      <form id="call-form"
        onsubmit="try { onDialerFormSubmit(this); } catch(e) { console.error('dialer form error', e) } finally { return false; }"
        style="display:none;">
        <h1>Call</h1>
        <br />
        <br />
        <input type="text" id="extension" name="extension" placeholder="Type an extension..." required />
        <br />

        <br />
        <!-- Dial pad section -->
        <div id="dialpad-section">

          <div class="dialpad">
            <button onclick="addDigit(event, '1')">1</button>
            <button onclick="addDigit(event, '2')">2</button>
            <button onclick="addDigit(event, '3')">3</button>
            <button onclick="addDigit(event, '4')">4</button>
            <button onclick="addDigit(event, '5')">5</button>
            <button onclick="addDigit(event, '6')">6</button>
            <button onclick="addDigit(event, '7')">7</button>
            <button onclick="addDigit(event, '8')">8</button>
            <button onclick="addDigit(event, '9')">9</button>
            <button onclick="addDigit(event, '*')">*</button>
            <button onclick="addDigit(event, '0')">0</button>
            <button onclick="addDigit(event, '#')">#</button>
          </div>
          <div class="dialpad-btn">
            <button type="submit" id="call-btn"><i class="fa fa-phone"></i></button>
            <button type="button" id="hangup-btn" onclick="onHangupClick()"><i class="fa fa-phone" style="font-size:36px;"></i></button>
          </div>
        </div>
        <br />
        <div class="call-controls">
        <button type="button" id="answer-btn" onclick="onAnswerClick()" style="display:none;"><i class="fa fa-phone"></i></button>
        <button type="button" id="transfer-btn" onclick="transfer()"><i class="fa fa-arrow-up"></i></button>
        <br />
        <button type="button" id="mute-btn" onclick="mute()"><i class="fa fa-microphone-slash"></i></button>
        <button type="button" id="unmute-btn" onclick="unmute()"><i class="fa fa-microphone"></i></button>
        <br />
        <button type="button" id="hold-btn" onclick="hold()"><i class="fa fa-pause"></i></button>
        <button type="button" id="unhold-btn" onclick="unhold()"><i class="fa fa-play"></i></button>
        <br />
      </div>
        <button type="button" id="unregister-btn" onclick="unregisterSipUser()">Unregister SIP User</button>
        <br />
      </form>

      <!-- Debug log area -->
      <div id="log-container">
        <div id="log"></div>
      </div>
      <div class="conference">
        <video id="local-video" width="250px" autoplay muted playsinline></video>
        <video id="remote-video" width="800px" autoplay playsinline></video>
      </div>
    </div>

  </div>



  <!-- SIP.js v16 Library -->
  <script src="https://cdn.jsdelivr.net/npm/sip.js@0.16.0/dist/sip.js"></script>

  <script src="main.js"></script>
</body>

</html>
